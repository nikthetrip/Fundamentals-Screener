name: Build Lynch data

on:
  # Lancio manuale con opzioni (bottone "Run workflow")
  workflow_dispatch:
    inputs:
      scope:
        description: "Universo da elaborare"
        type: choice
        default: "sp500+russell1000"
        options:
          - test               # 10 ticker, ~1 minuto
          - sp500              # S&P 500, ~500 societa', ~6 minuti
          - sp500+russell1000  # ~1000 large e mid cap, ~12 minuti
          - russell1000        # solo Russell 1000
          - us-all             # tutte le quotate USA (~6.600), diviso su piu' job
      freq:
        description: "Risoluzione storico: tocca solo il grafico, non i KPI"
        type: choice
        default: "W"
        options:
          - D         # giornaliero (file grande)
          - W         # settimanale
          - M         # mensile (file piccolo)
      shards:
        description: "Job paralleli (solo per us-all; 1 = job singolo)"
        type: choice
        default: "6"
        options: ["1", "2", "4", "6", "8", "12"]
  # ---------------------------------------------------------------------------
  # AGGIORNAMENTO AUTOMATICO
  #
  # Le tre cadenze qui sotto sono ALTERNATIVE, non cumulative. Il dataset e' un
  # unico set di CSV in data/: se due schedulazioni girano con universi diversi,
  # l'ultima sovrascrive la precedente e i dati oscillano fra un universo e
  # l'altro senza che nulla lo segnali. Se invece girassero con lo stesso
  # universo, la piu' frequente renderebbe le altre inutili.
  # Quindi: UNA sola attiva. Per cambiare cadenza, commenta quella in uso e
  # togli il commento a quella che vuoi.
  #
  # L'ORA E' IN UTC, GitHub non accetta fusi. 02:00 UTC sono le 04:00 a Roma da
  # fine marzo a fine ottobre (ora legale) e le 03:00 nei mesi di ora solare.
  # Non vale la pena inseguire lo scarto: GitHub accoda i job schedulati e li
  # avvia con ritardi che arrivano a mezz'ora.
  #
  # Il bottone "Run workflow" resta sempre disponibile per un aggiornamento
  # immediato, con qualunque universo e risoluzione.
  # ---------------------------------------------------------------------------
  schedule:
    # ATTIVA — ogni giorno alle 4 del mattino (ora di Roma)
    - cron: "0 2 * * *"

    # Ogni lunedi' alle 4 del mattino
    # - cron: "0 2 * * 1"

    # Il primo giorno di ogni mese alle 4 del mattino
    # - cron: "0 2 1 * *"

permissions:
  contents: write

# Una build alla volta. Con la cadenza giornaliera una run lunga (us-all) puo'
# accavallarsi con quella successiva: due job che scrivono gli stessi CSV e
# fanno push sullo stesso branch si sovrascrivono a vicenda. In coda, non in
# parallelo — e senza cancellare quella in corso, che ha gia' fatto il lavoro.
concurrency:
  group: build-lynch-data
  cancel-in-progress: false

env:
  SCOPE: ${{ github.event.inputs.scope || 'sp500+russell1000' }}
  FREQ: ${{ github.event.inputs.freq || 'W' }}

jobs:
  # -------------------------------------------------------------------------
  # 1. Test offline della logica + calcolo di quanti job servono.
  #    I test girano una volta sola, non dentro ogni shard.
  # -------------------------------------------------------------------------
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      shards: ${{ steps.set.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verifica che il contatto per la SEC sia configurato
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          # La SEC risponde 403 alle richieste senza un contatto reale, quindi
          # senza questo segreto la build non puo' funzionare. Meglio fermarsi
          # qui in dieci secondi che dopo aver installato tutto e girato i test.
          if [ -z "${SEC_USER_AGENT:-}" ] || case "$SEC_USER_AGENT" in *@*) false ;; *) true ;; esac; then
            echo "::error::Manca il secret SEC_USER_AGENT (o non contiene una email)."
            echo "Impostalo in Settings → Secrets and variables → Actions:"
            echo "  nome:   SEC_USER_AGENT"
            echo "  valore: Fundamentals Screener tua@email.com"
            exit 1
          fi
          echo "Contatto SEC configurato."

      - name: Verifica logica (test offline)
        run: |
          python test_logic.py
          python test_categories.py
          python test_guardrails.py
          python test_filings.py
          python test_financials.py
          # Regressione su companyfacts SEC reali congelati: blocca la pipeline
          # se il TTM torna a sommare quattro punti su cinque trimestri.
          python test_ttm_regression.py
      - name: Quanti job
        id: set
        run: |
          # Solo l'intero listino ha bisogno di essere diviso: sotto il
          # migliaio di ticker un job singolo finisce in pochi minuti e la
          # divisione aggiungerebbe solo il costo di unire i pezzi.
          if [ "$SCOPE" = "us-all" ]; then
            N="${{ github.event.inputs.shards || '6' }}"
          else
            N=1
          fi
          echo "shards=$N" >> "$GITHUB_OUTPUT"
          echo "matrix=$(python -c "import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))" "$N")" >> "$GITHUB_OUTPUT"
          {
            echo "### Build Lynch data"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Universo | \`$SCOPE\` |"
            echo "| Risoluzione storico | \`$FREQ\` |"
            echo "| Job paralleli | $N |"
            echo "| Avvio | ${{ github.event_name }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # 2. Elaborazione vera e propria, eventualmente divisa fra piu' job.
  # -------------------------------------------------------------------------
  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330       # sotto il tetto di 6 ore di GitHub Actions
    strategy:
      fail-fast: false          # uno shard che cade non deve buttare gli altri
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Build dataset (EDGAR + prezzi)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SHARDS: ${{ needs.plan.outputs.shards }}
          SHARD: ${{ matrix.shard }}
        run: |
          # Lo scope arriva dal menu della Action ed e' gia' un nome di
          # universo valido per build_dataset.py, unioni con '+' comprese.
          UNIVERSE="$SCOPE"
          echo "Universo $UNIVERSE · shard $SHARD/$SHARDS · risoluzione $FREQ"
          python build_dataset.py \
            --universe "$UNIVERSE" --freq "$FREQ" \
            --shard "$SHARD" --shards "$SHARDS" --workers 6

      - name: Carica i risultati parziali
        uses: actions/upload-artifact@v4
        with:
          name: data-shard-${{ matrix.shard }}
          path: data/
          retention-days: 1

  # -------------------------------------------------------------------------
  # 3. Unione dei pezzi e commit. Un solo job scrive sul repo, quindi non
  #    esistono commit concorrenti da riconciliare.
  # -------------------------------------------------------------------------
  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Storia completa, non il clone superficiale di default.
          # Con KEEP_SINGLE_DATA_COMMIT il commit di dati viene RISCRITTO, e
          # riscrivere il vertice di un clone a profondita' 1 significa spingere
          # una storia troncata: il suo unico commit ha un genitore che in locale
          # non esiste. Con la storia intera l'operazione e' quella che sembra.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Scarica i risultati di tutti i job
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Unisci i pezzi
        run: |
          mkdir -p data
          find artifacts -type f -name '*.csv*' -exec cp {} data/ \;
          ls -la data/
          # No-op quando il job era uno solo: i file sono gia' definitivi.
          python build_dataset.py --merge

      - name: Dimensione dei dati generati
        run: |
          ls -lh data/
          echo "Righe history: $(gzip -cd data/history.csv.gz | wc -l)"
          echo "Ticker:        $(($(wc -l < data/fundamentals.csv) - 1))"

      # I test girano sulla LOGICA, con dati sintetici. Questo gira sui DATI
      # APPENA COSTRUITI: riclassifica ogni ticker e verifica che nessun esito
      # contraddica il ramo da cui esce, che il fair value resti una funzione
      # continua della crescita e che la copertura non crolli.
      #
      # Sta PRIMA del commit di proposito. Un difetto della meccanica non si
      # presenta come un errore, si presenta come un numero plausibile e
      # sbagliato: se passasse di qui, finirebbe nella dashboard senza che nulla
      # lo segnali. Meglio nessun aggiornamento che un dataset che si contraddice.
      - name: Audit della classificazione sui dati appena costruiti
        run: python audit_dataset.py --data data

      # Descrizione dell'attivita' e consenso degli analisti: sono i riquadri
      # che la dashboard scarica al momento e che l'app iOS non puo' chiedere
      # da sola (Yahoo protegge quelle API con un cookie piu' un crumb che
      # cambia senza preavviso). Una chiamata leggera per titolo, pochi minuti.
      #
      # LA RIPARTIZIONE DEI RICAVI NON E' QUI. `--segments` scarica l'XBRL
      # completo dell'ultimo bilancio di ogni societa': fra 1 e 15 MB a testa,
      # cioe' alcuni gigabyte e ore di lavoro su mille titoli, ogni notte, per
      # un dato che cambia una volta l'anno. Lo script tiene una cache per
      # numero di deposito che rende gratuite le esecuzioni successive alla
      # prima: per attivarlo servono quella cache (actions/cache) e la
      # decisione di spendere la prima notte.
      - name: Profili e obiettivi degli analisti
        continue-on-error: true          # un riquadro in meno non ferma la build
        run: python build_extras.py --workers 6

      # DOPO l'audit, non prima. Il database mobile e' una copia degli stessi
      # numeri in un altro contenitore: se l'audit boccia il dataset la build si
      # ferma qui e l'app continua a scaricare l'ultimo database valido, invece
      # di riceverne uno nuovo che contraddice se stesso.
      # I commenti sono aritmetica sui numeri appena verificati: girano dopo
      # l'audit e prima dell'impacchettamento, cosi' un dataset bocciato non
      # produce nemmeno le frasi che lo descrivono.
      - name: Commenti di valutazione
        run: python build_commentary.py

      - name: Impacchetta il database per l'app iOS
        run: python build_mobile_db.py

      - name: Commit dei dati aggiornati
        env:
          # QUANTO PESA UNA BUILD AL GIORNO.
          # Ogni run riscrive ~6 MB di CSV, e git conserva ogni versione come
          # blob nuovo (un .gz cambia per intero, non si comprime per differenze).
          # Committando in accodamento sono circa 2 GB di oggetti git all'anno:
          # GitHub consiglia di restare sotto 1 GB e avvisa a 5.
          #
          #   "true" (impostato) — l'ultimo commit di dati viene RISCRITTO
          #            invece di accodato: sulla repo resta sempre un solo
          #            commit di dati e la dimensione non cresce. Serve un
          #            force-push, quindi da una copia locale dopo un
          #            aggiornamento ci vuole `git pull --rebase`.
          #   "false" — ogni aggiornamento e' un commit in piu': storia completa
          #            dei dataset passati, repo che cresce, `git pull` sempre
          #            liscio.
          #
          # I commit di CODICE non vengono mai toccati: la riscrittura avviene
          # solo se il vertice e' gia' un commit di dati. Se hai appena spinto
          # del codice, il primo aggiornamento successivo crea un commit nuovo e
          # da li' riprende a riscrivere quello.
          KEEP_SINGLE_DATA_COMMIT: "true"
          DATA_COMMIT_PREFIX: "Update Lynch dataset"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/history.csv.gz data/fundamentals.csv data/screener.sqlite.gz
          for f in events filings skipped financials_annual cagr_detail profile segments commentary; do
            git add -f "data/$f.csv" 2>/dev/null || true
          done
          git rm --cached -q data/history.csv 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati: niente da committare."
            exit 0
          fi

          MSG="$DATA_COMMIT_PREFIX ($SCOPE, freq $FREQ)"
          if [ "$KEEP_SINGLE_DATA_COMMIT" = "true" ] \
             && git log -1 --pretty=%s | grep -q "^$DATA_COMMIT_PREFIX"; then
            echo "Riscrivo il commit di dati precedente (repo a dimensione costante)."
            git commit --amend -m "$MSG"
            # --force-with-lease, non --force: se nel frattempo qualcuno ha
            # spinto sul branch il push viene RIFIUTATO invece di cancellare il
            # suo lavoro. In quel caso non si perde nulla: basta rilanciare.
            if ! git push --force-with-lease; then
              echo "::error::Push rifiutato: il branch e' cambiato durante la build."
              echo "Nessun dato perso. Rilancia la Action."
              exit 1
            fi
          else
            git commit -m "$MSG"
            git push
          fi
